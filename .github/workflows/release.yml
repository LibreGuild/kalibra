# Releases from a version tag:  git tag v0.2.0 && git push origin v0.2.0
#
# Kalibra ships as the npm package and the Docker image only (no desktop installers):
#   npm      the `kalibra` package and the `kalibra-sdk` JavaScript SDK, STAGED (dist-tag `next` for
#            pre-releases, `latest` otherwise): a maintainer approves each on npmjs.com (Staged
#            Packages) with 2FA, then it goes live.
#   pypi     the `kalibra-sdk` Python SDK (pre-releases as 0.3.0b1 etc.).
#   docker   ghcr.io/libreguild/kalibra:<version> (+ :next for pre-releases, :latest otherwise), amd64 and arm64
#   github   a GitHub release with notes pointing to npm and Docker, no files (pre-release for -beta/-rc tags)
#
# npm and PyPI use trusted publishing (OIDC, no stored tokens): each package trusts this repo's
# release.yml. On npm that trust is `npm stage publish` only, so a workflow on its own can never put
# a version live. Every publish step skips a version that is already there, so a release can be
# re-run (Actions → Release → Run workflow → tag).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again (e.g. v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Not a version tag: $TAG"; exit 1; fi
          if [[ "$VERSION" == *-* ]]; then PRE=true; CHANNEL=next; else PRE=false; CHANNEL=latest; fi
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "prerelease=$PRE"; echo "channel=$CHANNEL"; } >> "$GITHUB_OUTPUT"

  docker:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name (lowercase), and is this version already pushed?
        id: img
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" >/dev/null 2>&1; then
            echo "Image $VERSION already exists; not rebuilding it"; echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.img.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.meta.outputs.version }}
            ${{ steps.img.outputs.name }}:${{ needs.meta.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.meta.outputs.version }}
      - run: npm run build -w @kalibra/web
      - name: Stage on npm (approve on npmjs.com → Staged Packages)
        working-directory: packages/cli
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if npm view "kalibra@$VERSION" version >/dev/null 2>&1; then echo "kalibra@$VERSION is already on npm"; exit 0; fi
          npm stage publish . --tag "$CHANNEL" --access public
          echo "::notice::kalibra@$VERSION is staged. Approve it at https://www.npmjs.com (avatar → Staged Packages) to publish it." 

  npm-sdk:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.meta.outputs.version }}
      - run: npm run build -w kalibra-sdk
      - name: Stage kalibra-sdk on npm (approve on npmjs.com → Staged Packages)
        working-directory: packages/sdk
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if npm view "kalibra-sdk@$VERSION" version >/dev/null 2>&1; then echo "kalibra-sdk@$VERSION is already on npm"; exit 0; fi
          npm stage publish . --tag "$CHANNEL" --access public
          echo "::notice::kalibra-sdk@$VERSION is staged. Approve it at https://www.npmjs.com (avatar → Staged Packages)."

  pypi:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Sets the Python SDK's version from the tag (0.3.0-beta.1 → 0.3.0b1); plain Node, no install.
      - run: node scripts/set-version.mjs ${{ needs.meta.outputs.version }}
      - name: Already on PyPI?
        id: check
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('sdks/python/pyproject.toml', 'rb'))['project']['version'])")
          if curl -sf "https://pypi.org/pypi/kalibra-sdk/$V/json" >/dev/null; then echo "kalibra-sdk $V is already on PyPI"; echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build the wheel and sdist
        if: steps.check.outputs.exists != 'true'
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build sdks/python --outdir dist
          python -m twine check --strict dist/*
      - name: Publish to PyPI (trusted publishing)
        if: steps.check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github:
    needs: [meta, npm, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release (notes only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          PRE: ${{ needs.meta.outputs.prerelease }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "npx kalibra@$VERSION                 # or: npm i -g kalibra@$VERSION && kalibra"
            echo "docker run -p 4317:4317 -v kalibra-data:/data $IMAGE:$VERSION   # then open http://localhost:4317/kalibra/"
            echo '```'
            echo
            echo
            echo "SDKs: \`npm i kalibra-sdk@$VERSION\` and \`pip install kalibra-sdk\` (see the SDK docs in the app)."
            echo
            echo "The npm versions go live once a maintainer approves them on npmjs.com (dist-tag \`$CHANNEL\`)."
          } > notes.md
          flags=(--repo "$GITHUB_REPOSITORY" --title "Kalibra $TAG" --notes-file notes.md --generate-notes --verify-tag)
          if [ "$PRE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" "${flags[@]}"
          fi
