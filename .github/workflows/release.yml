# Releases from a version tag:  git tag v0.1.1-beta.1 && git push origin v0.1.1-beta.1
#
# Kalibra ships as the npm package and the Docker image only (no desktop installers):
#   npm      the `kalibra` package, STAGED (dist-tag `next` for pre-releases, `latest` otherwise):
#            a maintainer approves it on npmjs.com (Staged Packages) with 2FA, then it goes live.
#   docker   ghcr.io/libreguild/kalibra:<version> (+ :next for pre-releases, :latest otherwise), amd64 and arm64
#   github   a GitHub release with notes pointing to npm and Docker, no files (pre-release for -beta/-rc tags)
#
# npm uses trusted publishing (OIDC, no token): the package trusts this repo's release.yml for
# `npm stage publish` only, so a workflow on its own can never put a version live.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again (e.g. v0.1.1-beta.1)
        required: true

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Not a version tag: $TAG"; exit 1; fi
          if [[ "$VERSION" == *-* ]]; then PRE=true; CHANNEL=next; else PRE=false; CHANNEL=latest; fi
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "prerelease=$PRE"; echo "channel=$CHANNEL"; } >> "$GITHUB_OUTPUT"

  docker:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.meta.outputs.version }}
            ${{ steps.img.outputs.name }}:${{ needs.meta.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.meta.outputs.version }}
      - run: npm run build -w @kalibra/web
      - name: Stage on npm (approve on npmjs.com → Staged Packages)
        working-directory: packages/cli
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if npm view "kalibra@$VERSION" version >/dev/null 2>&1; then echo "kalibra@$VERSION is already on npm"; exit 0; fi
          npm stage publish . --tag "$CHANNEL" --access public
          echo "::notice::kalibra@$VERSION is staged. Approve it at https://www.npmjs.com (avatar → Staged Packages) to publish it." 

  github:
    needs: [meta, npm, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release (notes only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          PRE: ${{ needs.meta.outputs.prerelease }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "npx kalibra@$VERSION                 # or: npm i -g kalibra@$VERSION && kalibra"
            echo "docker run -p 4317:4317 -v kalibra-data:/data $IMAGE:$VERSION   # then open http://localhost:4317/kalibra/"
            echo '```'
            echo
            echo "The npm version goes live once a maintainer approves it on npmjs.com (dist-tag \`$CHANNEL\`)."
          } > notes.md
          flags=(--repo "$GITHUB_REPOSITORY" --title "Kalibra $TAG" --notes-file notes.md --generate-notes --verify-tag)
          if [ "$PRE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" "${flags[@]}"
          fi
