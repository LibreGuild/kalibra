# Typecheck, test and build (compile only) on pull requests and pushes to main.
# The Docker image and npm releases come only from release.yml, on a version tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the web UI and the CLI bundle
        run: npm run build -w @kalibra/web && npm run build -w kalibra
      - name: Smoke-test the CLI bundle
        run: |
          node packages/cli/dist/kalibra.mjs --help
          node packages/cli/dist/kalibra.mjs users list --dir "$RUNNER_TEMP/kalibra"

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Oldest and newest supported versions.
          python-version: |
            3.9
            3.13
      - name: Unit tests on Python 3.9
        run: python3.9 -m unittest discover -s sdks/python/tests -v
      - name: Unit tests on Python 3.13
        run: python3.13 -m unittest discover -s sdks/python/tests -v
