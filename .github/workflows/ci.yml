# Typecheck, test and build (compile only, no installers) on pull requests and pushes to main.
# Installers, images and npm releases come only from release.yml, on a version tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The desktop app's Electron binary is only needed by the release workflow.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the web UI and the CLI bundle
        run: npm run build -w @kalibra/web && npm run build -w kalibra
      - name: Smoke-test the CLI bundle
        run: |
          node packages/cli/dist/kalibra.mjs --help
          node packages/cli/dist/kalibra.mjs users list --dir "$RUNNER_TEMP/kalibra"

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Oldest and newest supported versions.
          python-version: |
            3.9
            3.13
      - name: Unit tests on Python 3.9
        run: python3.9 -m unittest discover -s sdks/python/tests -v
      - name: Unit tests on Python 3.13
        run: python3.13 -m unittest discover -s sdks/python/tests -v
