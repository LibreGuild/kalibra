# Typecheck, test (on SQLite and on Postgres) and build (compile only) on pull requests and pushes to main.
# The Docker image and npm releases come only from release.yml, on a version tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the web UI and the CLI bundle
        run: npm run build -w @kalibra/web && npm run build -w kalibra
      - name: Smoke-test the CLI bundle
        run: |
          node packages/cli/dist/kalibra.mjs --help
          node packages/cli/dist/kalibra.mjs users list --dir "$RUNNER_TEMP/kalibra"

  # The same suite with every hub and project in Postgres (KALIBRA_DATABASE_URL deployments).
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: kalibra
          POSTGRES_PASSWORD: kalibra
          POSTGRES_DB: kalibra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kalibra"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          KALIBRA_TEST_DATABASE_URL: postgres://kalibra:kalibra@127.0.0.1:5432/kalibra

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Oldest and newest supported versions.
          python-version: |
            3.9
            3.13
      - name: Unit tests on Python 3.9
        run: python3.9 -m unittest discover -s sdks/python/tests -v
      - name: Unit tests on Python 3.13
        run: python3.13 -m unittest discover -s sdks/python/tests -v
