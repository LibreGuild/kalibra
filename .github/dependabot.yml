# Weekly dependency updates, grouped so they arrive as a few pull requests rather than dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # Actions are pinned to commit SHAs (with the version in a comment); Dependabot bumps both.
    directories: [/, /action]
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: pip
    directory: /sdks/python
    schedule: { interval: weekly, day: monday }
