<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kalibra</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem('kalibra.theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.font = localStorage.getItem('kalibra.font') || 'atkinson';
          root.dataset.accent = localStorage.getItem('kalibra.accent') || 'clay';
          root.style.setProperty('--k-scale', localStorage.getItem('kalibra.scale') || '1');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
