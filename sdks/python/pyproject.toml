[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalibra-sdk"
version = "0.1.1b1"
description = "Send what happens inside your AI app to Kalibra: traces, steps, tool record/replay, and evals from your tests."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LibreGuild" }]
keywords = ["llm", "evals", "evaluation", "tracing", "ai", "rag", "agents", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# Standard library only: nothing to install besides this package.
dependencies = []

[project.urls]
Homepage = "https://github.com/LibreGuild/kalibra"
Documentation = "https://github.com/LibreGuild/kalibra/tree/main/sdks/python#readme"
Issues = "https://github.com/LibreGuild/kalibra/issues"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalibra = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
